# Configuration file for Maxon EPOS3 drive
vendor_id: 0x00001097
product_id: 0x00002406
assign_activate: 0x0300 # DC Synch register
auto_fault_reset: true # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"

# ...
auto_fault_reset: true
auto_state_transitions: true

error_log:
  enabled: true
  path: /home/robot/Desktop/ecat_error_snapshot.jsonl   # 建议写到 SSD/磁盘
  every_n_cycles: 500                                # 1 kHz*500 = 0.5 s


sdo: # sdo data to be transferred at drive startup
  # - { index: 0x6060, sub_index: 0, type: uint8, value: 10} # Set base 10-3s
  # - { index: 0x6040, sub_index: 0, type: uint16, value: 6} # 
  # - { index: 0x6040, sub_index: 0, type: uint16, value: 7} # 
  # - { index: 0x6040, sub_index: 0, type: uint16, value: 15} # 

rpdo: # RxPDO = receive PDO 6 Mapping
  - index: 0x1600
    channels:
      - { index: 0x6040, sub_index: 0, type: uint16} # Control word
      - { index: 0x607a, sub_index: 0, type: int32,command_interface: position,default: .nan} # Target position
      - { index: 0x60ff, sub_index: 0, type: int32} # Target velocity
      - { index: 0x6071, sub_index: 0, type: int16, command_interface: effort, default: .nan} # Target torque
      - { index: 0x6060, sub_index: 0, type: int8} # operating mode
      - { index: 0x60c1, sub_index: 0, type: uint8, default: 1 } # 自定义8位字典项，默认值1
      # - { index: 0x0000, sub_index: 0, type: int8} # resv 要求16位字节对齐  选择一个无影响的占用，不要用0x0000,可能导致pdo读取异常
tpdo: # TxPDO = transmit PDO 7 Mapping
  - index: 0x1a00
    channels:
      - { index: 0x6041, sub_index: 0, type: uint16} # Status word
      - { index: 0x6064, sub_index: 0, type: int32, state_interface: position} # Position actual value
      - { index: 0x606c, sub_index: 0, type: int32} # Velocity actual value
      - { index: 0x6077, sub_index: 0, type: int16, state_interface: effort} # Torque actual value
      - { index: 0x6061, sub_index: 0, type: int8} # Mode of operation display
      - { index: 0x60c2, sub_index: 0, type: uint8, default: 1 } # 自定义8位字典项，默认值1
      # - { index: 0x603f, sub_index: 0, type: int16} # Digital Input Functionalities State
      # - { index: 0x0000, sub_index: 0, type: int8} # resv 要求16位字节对齐

sm:  # Sync Manager
  - {index: 0, type: output, pdo: ~, watchdog: disable}  # MBoxOut
  - {index: 1, type: input, pdo: ~, watchdog: disable}   # MBoxIn
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}  # Outputs
  - {index: 3, type: input, pdo: tpdo, watchdog: enable}  # Inputs


  