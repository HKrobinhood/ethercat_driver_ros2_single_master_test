# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    lock_memory: false

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:  # 这个名控制器名称要和moveit_controllers.yaml里的名字一样
  ros__parameters:
    joints:           # 这个是关节名称要和SRDF里的一样
      - L1
      - L2
      - L3  
      - L4
      - L5
      - L6
      - L7

      
    command_interfaces:  
      - position

    state_interfaces:   
      - position
      - velocity


right_arm_controller:
  ros__parameters:
    joints:
      - R1
      - R2
      - R3
      - R4
      - R5
      - R6
      - R7

      
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity


            

